name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Kalau ada langkah yang gagal, website tetap dinyalakan lagi
            trap 'echo "!!! Deploy gagal, menonaktifkan maintenance mode"; php artisan up || true' ERR

            echo "=== 1. Mengaktifkan Maintenance Mode ==="
            php artisan down --retry=60 || true

            echo "=== 2. Mengambil Kode Terbaru ==="
            git pull origin main

            echo "=== 3. Menginstal Dependensi PHP ==="
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            echo "=== 4. Membangun Aset Frontend & SSR ==="
            npm ci
            npm run build

            echo "=== 5. Menjalankan Migrasi Database ==="
            # Buang cache (config, route, daftar kelas settings) dari rilis sebelumnya dulu: migrasi
            # settings membaca daftar kelas settings, dan kelas yang sudah dihapus membuatnya gagal.
            php artisan optimize:clear
            php artisan migrate --force

            echo "=== 5b. Cek mysqldump untuk backup ==="
            if ! command -v mysqldump >/dev/null 2>&1; then
              echo "mysqldump belum ada, mencoba memasang..."
              if [ "$(id -u)" = "0" ]; then
                apt-get update -y && (apt-get install -y mysql-client || apt-get install -y mariadb-client) || true
              elif sudo -n true 2>/dev/null; then
                sudo apt-get update -y && (sudo apt-get install -y mysql-client || sudo apt-get install -y mariadb-client) || true
              else
                echo "PERINGATAN: mysqldump belum terpasang dan user deploy tidak punya akses sudo."
              fi
            fi
            command -v mysqldump >/dev/null 2>&1 && echo "mysqldump OK: $(command -v mysqldump)" || echo "mysqldump TIDAK tersedia"

            echo "=== 6. Import Data (hanya jika file data berubah) ==="
            MARK_DIR=storage/app/import-markers
            mkdir -p "$MARK_DIR"

            import_if_changed () {
              FILE="$1"; CMD="$2"; FIRST_FLAGS="$3"
              if [ ! -f "$FILE" ]; then
                echo "Lewati: $FILE tidak ditemukan"
                return 0
              fi
              HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
              MARK="$MARK_DIR/$(basename "$FILE").sha256"
              if [ -f "$MARK" ] && [ "$(cat "$MARK")" = "$HASH" ]; then
                echo "Tidak berubah, lewati: $FILE"
                return 0
              fi
              FLAGS=""
              if [ ! -f "$MARK" ]; then FLAGS="$FIRST_FLAGS"; fi
              echo "Backup database sebelum import $FILE"
              if ! php artisan backup:run --only-db --disable-notifications; then
                if echo "$FLAGS" | grep -q -- "--fresh"; then
                  echo "Backup gagal. Import --fresh dibatalkan supaya data tidak hilang."
                  exit 1
                fi
                echo "Peringatan: backup gagal, import (tanpa hapus data) tetap dilanjutkan"
              fi
              echo "Import $FILE $FLAGS"
              php artisan $CMD "$FILE" $FLAGS --force --no-interaction
              echo "$HASH" > "$MARK"
            }

            # Urutan penting: data utama dulu, lalu update berikutnya
            import_if_changed docs/data/bsd-city-data.json     import:bsd-data   --fresh
            import_if_changed docs/data/bsd-city-update-2.json import:bsd-update ""

            echo "=== 7. Memastikan Symlink Storage ==="
            php artisan storage:link || true

            echo "=== 8. Mengoptimalkan Cache Laravel & Filament ==="
            php artisan optimize:clear
            php artisan optimize
            php artisan filament:optimize

            echo "=== 9. Merestart Inertia SSR & Queue Worker ==="
            php artisan inertia:stop-ssr || true
            php artisan queue:restart || true

            echo "=== 9b. Cek queue worker (konversi foto WebP) & scheduler ==="
            # Hanya laporan, tidak menggagalkan deploy. Baris ::notice/::warning muncul di ringkasan GitHub Actions.
            CRON_LINE="* * * * * cd $(pwd) && php artisan schedule:run >> /dev/null 2>&1"
            if (crontab -l 2>/dev/null; cat /etc/crontab /etc/cron.d/* 2>/dev/null) | grep -v '^\s*#' | grep -q "schedule:run"; then
              CRON="terpasang"
            else
              CRON="BELUM terpasang"
            fi
            WORKERS=$(pgrep -fc "[a]rtisan queue:work" 2>/dev/null || true)
            SUPERVISOR=$( (command -v supervisorctl >/dev/null 2>&1 && (supervisorctl status 2>/dev/null || sudo -n supervisorctl status 2>/dev/null) | grep -ci "queue") || true)
            QUEUE_INFO=$(php artisan tinker --execute 'echo DB::table("jobs")->count()." job antre (tertua: ".(DB::table("jobs")->min("created_at") ? date("Y-m-d H:i", (int) DB::table("jobs")->min("created_at")) : "-")."), ".DB::table("failed_jobs")->count()." job gagal; per queue: ".DB::table("jobs")->selectRaw("queue, count(*) n, max(attempts) a, sum(reserved_at is not null) r")->groupBy("queue")->get()->map(fn ($q) => "{$q->queue}={$q->n} (attempts {$q->a}, reserved {$q->r})")->join(", ")."; heartbeat scheduler: ".(Storage::disk("local")->exists("scheduler-heartbeat") ? Storage::disk("local")->get("scheduler-heartbeat") : "belum ada");' 2>/dev/null || echo "tidak terbaca")
            echo "--- 5 baris terakhir storage/logs/queue-worker.log ---"
            tail -n 5 storage/logs/queue-worker.log 2>/dev/null || echo "(belum ada log worker)"
            echo "--- crontab ---"
            (crontab -l 2>/dev/null | grep -v '^\s*#' | grep "schedule:run") || true
            (systemctl is-active cron 2>/dev/null || service cron status 2>/dev/null | head -1) || true
            echo "Cron schedule:run: $CRON (user $(whoami)); proses queue:work aktif: ${WORKERS:-0}; program queue di Supervisor: ${SUPERVISOR:-0}; $QUEUE_INFO"
            if [ "$CRON" = "terpasang" ]; then
              echo "::notice title=Queue & scheduler::Cron schedule:run terpasang (user $(whoami)). Worker queue: ${WORKERS:-0} proses, Supervisor: ${SUPERVISOR:-0}. $QUEUE_INFO"
            else
              echo "::warning title=Queue & scheduler::Cron schedule:run BELUM terpasang untuk user $(whoami): foto baru tidak dibuatkan WebP & backup harian tidak jalan. Pasang lewat 'crontab -e': $CRON_LINE  | Worker queue: ${WORKERS:-0} proses, Supervisor: ${SUPERVISOR:-0}. $QUEUE_INFO"
            fi

            echo "=== 10. Menonaktifkan Maintenance Mode ==="
            php artisan up

            echo "=== Deployment Berhasil Selesai! ==="
