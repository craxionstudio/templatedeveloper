name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Kalau ada langkah yang gagal, website tetap dinyalakan lagi
            trap 'echo "!!! Deploy gagal, menonaktifkan maintenance mode"; php artisan up || true' ERR

            echo "=== 1. Mengaktifkan Maintenance Mode ==="
            php artisan down --retry=60 || true

            echo "=== 2. Mengambil Kode Terbaru ==="
            git pull origin main

            echo "=== 3. Menginstal Dependensi PHP ==="
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            echo "=== 4. Membangun Aset Frontend & SSR ==="
            npm ci
            npm run build

            echo "=== 5. Menjalankan Migrasi Database ==="
            # Buang cache (config, route, daftar kelas settings) dari rilis sebelumnya dulu: migrasi
            # settings membaca daftar kelas settings, dan kelas yang sudah dihapus membuatnya gagal.
            php artisan optimize:clear
            php artisan migrate --force

            echo "=== 5b. Cek mysqldump untuk backup ==="
            if ! command -v mysqldump >/dev/null 2>&1; then
              echo "mysqldump belum ada, mencoba memasang..."
              if [ "$(id -u)" = "0" ]; then
                apt-get update -y && (apt-get install -y mysql-client || apt-get install -y mariadb-client) || true
              elif sudo -n true 2>/dev/null; then
                sudo apt-get update -y && (sudo apt-get install -y mysql-client || sudo apt-get install -y mariadb-client) || true
              else
                echo "PERINGATAN: mysqldump belum terpasang dan user deploy tidak punya akses sudo."
              fi
            fi
            command -v mysqldump >/dev/null 2>&1 && echo "mysqldump OK: $(command -v mysqldump)" || echo "mysqldump TIDAK tersedia"

            echo "=== 6. Import Data (hanya jika file data berubah) ==="
            MARK_DIR=storage/app/import-markers
            mkdir -p "$MARK_DIR"

            import_if_changed () {
              FILE="$1"; CMD="$2"; FIRST_FLAGS="$3"
              if [ ! -f "$FILE" ]; then
                echo "Lewati: $FILE tidak ditemukan"
                return 0
              fi
              HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
              MARK="$MARK_DIR/$(basename "$FILE").sha256"
              if [ -f "$MARK" ] && [ "$(cat "$MARK")" = "$HASH" ]; then
                echo "Tidak berubah, lewati: $FILE"
                return 0
              fi
              FLAGS=""
              if [ ! -f "$MARK" ]; then FLAGS="$FIRST_FLAGS"; fi
              echo "Backup database sebelum import $FILE"
              if ! php artisan backup:run --only-db --disable-notifications; then
                if echo "$FLAGS" | grep -q -- "--fresh"; then
                  echo "Backup gagal. Import --fresh dibatalkan supaya data tidak hilang."
                  exit 1
                fi
                echo "Peringatan: backup gagal, import (tanpa hapus data) tetap dilanjutkan"
              fi
              echo "Import $FILE $FLAGS"
              php artisan $CMD "$FILE" $FLAGS --force --no-interaction
              echo "$HASH" > "$MARK"
            }

            # Urutan penting: data utama dulu, lalu update berikutnya
            import_if_changed docs/data/bsd-city-data.json     import:bsd-data   --fresh
            import_if_changed docs/data/bsd-city-update-2.json import:bsd-update ""

            echo "=== 7. Memastikan Symlink Storage ==="
            php artisan storage:link || true

            echo "=== 8. Mengoptimalkan Cache Laravel & Filament ==="
            php artisan optimize:clear
            php artisan optimize
            php artisan filament:optimize

            echo "=== 9. Cron scheduler & queue (konversi foto WebP) ==="
            # Idempotent: baris cron aplikasi ini ditambahkan kalau belum ada; baris cron lain tidak diubah.
            bash scripts/server/ensure-cron.sh || echo "::warning title=Cron::Baris cron scheduler gagal dipasang, lihat log langkah 9."
            php artisan queue:restart || true
            QUEUE_BEFORE=$(php artisan ops:queue-status 2>/dev/null || echo "tidak terbaca")
            echo "Sebelum: $QUEUE_BEFORE"
            # Proses sekali semua job yang tertunda (mis. konversi WebP); berikutnya diproses scheduler tiap menit.
            # --force: worker tetap jalan walau aplikasi masih maintenance mode (tanpa itu worker langsung berhenti).
            php artisan queue:work --force --stop-when-empty --tries=3 --max-time=600 2>&1 | tail -n 20 || true
            QUEUE_AFTER=$(php artisan ops:queue-status 2>/dev/null || echo "tidak terbaca")
            echo "Sesudah: $QUEUE_AFTER"
            echo "::notice title=Queue::Sebelum: $QUEUE_BEFORE | Sesudah: $QUEUE_AFTER"

            echo "=== 10. Server SSR (Supervisor, atau penjaga cron tanpa root) ==="
            # Hidup terus, restart otomatis setelah crash/reboot, dan memakai bundle baru setelah deploy.
            bash scripts/server/ensure-ssr.sh || echo "::warning title=SSR::Server SSR tidak berhasil dijalankan, lihat log langkah 10."

            echo "=== 11. Menonaktifkan Maintenance Mode ==="
            php artisan up

            echo "=== 12. Cek SSR halaman /properti & scheduler ==="
            # Catatan: script_stop di ssh-action memeriksa exit code setelah SETIAP baris, jadi cabang "else"
            # di if/else multi-baris langsung menghentikan deploy. Di sini dipakai bentuk satu baris.
            SSR_RESULT=$(php artisan ssr:check /properti 2>&1) && SSR_OK=1 || SSR_OK=0
            echo "$SSR_RESULT"
            [ "$SSR_OK" = "1" ] && echo "::notice title=SSR::$SSR_RESULT" || echo "::warning title=SSR GAGAL::/properti TIDAK dirender di server (HTML hanya div kosong): $SSR_RESULT. Cek storage/logs/ssr.log dan langkah 10 di log deploy."
            # APP_ENV selain production = semua halaman dikirim noindex (dan Inertia DevTools aktif).
            APP_ENV_NOW=$(php artisan env 2>/dev/null | grep -o '\[[a-z]*\]' | tr -d '[]')
            [ "$APP_ENV_NOW" = "production" ] && echo "APP_ENV: production" || echo "::warning title=APP_ENV bukan production::APP_ENV di server = '$APP_ENV_NOW'. Akibatnya semua halaman dikirim noindex (tidak masuk Google) dan Inertia DevTools aktif. Ubah APP_ENV=production di .env server."
            # Bukti cron berjalan: heartbeat scheduler ditulis tiap menit. Tunggu paling lama 75 detik.
            DEPLOY_TS=$(date +%s)
            HB_OK=0
            for i in $(seq 1 15); do
              HB_FILE=$(ls storage/app/private/scheduler-heartbeat storage/app/scheduler-heartbeat 2>/dev/null | head -n1)
              if [ -n "$HB_FILE" ] && [ "$(stat -c %Y "$HB_FILE")" -ge "$DEPLOY_TS" ]; then HB_OK=1; break; fi
              sleep 5
            done
            QUEUE_NOW=$(php artisan ops:queue-status 2>/dev/null || echo "tidak terbaca")
            [ "$HB_OK" = "1" ] && echo "::notice title=Cron::Scheduler berjalan (heartbeat $(cat "$HB_FILE")). $QUEUE_NOW" || echo "::warning title=Cron::Heartbeat scheduler tidak diperbarui dalam 75 detik: cron schedule:run belum berjalan untuk folder $(pwd). $QUEUE_NOW"

            echo "=== Deployment Berhasil Selesai! ==="
